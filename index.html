<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>नयाँ ट्याब</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2367e8f9' stroke-width='2'><path d='M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z'/><polyline points='9 22 9 12 15 12 15 22'/></svg>">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@500;600;700;800&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: 'Noto Sans Devanagari', system-ui, -apple-system, sans-serif;
      font-weight: 700;
      color: #f1f5f9;
      text-align: center;
      overflow: hidden;
      background: #0f172a; /* Material dark navy */
    }

    /* ===== Liquid Glass ===== */
    .glass {
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow:
        0 8px 32px rgba(0, 0, 0, 0.28),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }

    /* Analog Clock */
    .clock-container {
      width: 210px;
      height: 210px;
      border-radius: 50%;
      position: relative;
      cursor: pointer;
      margin-bottom: 2rem;
      transition: transform 0.25s ease;
    }
    .clock-container:hover {
      transform: scale(1.04);
    }

    .hand {
      position: absolute;
      bottom: 50%;
      left: 50%;
      transform-origin: bottom center;
      border-radius: 8px;
      background: #e2e8f0;
    }
    .hour-hand {
      width: 6px;
      height: 52px;
      margin-left: -3px;
      background: #cbd5e1;
    }
    .minute-hand {
      width: 4px;
      height: 72px;
      margin-left: -2px;
      background: #e2e8f0;
    }
    .second-hand {
      width: 2px;
      height: 82px;
      margin-left: -1px;
      background: #67e8f9;
    }
    .center-dot {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 11px;
      height: 11px;
      background: #67e8f9;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 12px #67e8f9;
    }

    /* Digital */
    .digital-time {
      display: none;
      font-size: 5.6rem;
      font-weight: 800;
      letter-spacing: -3px;
      margin-bottom: 1.4rem;
      cursor: pointer;
      color: #f1f5f9;
    }

    .weekday {
      font-size: 1.85rem;
      font-weight: 800;
      letter-spacing: 1px;
      margin-bottom: 0.35rem;
    }
    .nepali-date {
      font-size: 1.2rem;
      font-weight: 700;
      opacity: 0.85;
      margin-bottom: 1.6rem;
    }
    .greeting {
      font-size: 1.45rem;
      font-weight: 700;
      opacity: 0.9;
      margin-bottom: 2.2rem;
    }

    /* Search */
    .search-box {
      width: 90%;
      max-width: 460px;
      position: relative;
      margin-bottom: 2.6rem;
    }
    .search-box input {
      width: 100%;
      padding: 16px 52px 16px 24px;
      font-size: 1.15rem;
      font-weight: 600;
      border-radius: 50px;
      border: none;
      color: #f1f5f9;
      outline: none;
    }
    .search-box input::placeholder {
      color: rgba(241, 245, 249, 0.45);
    }
    .search-box button {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 1.25rem;
      cursor: pointer;
    }

    /* Quick Links */
    .links {
      display: flex;
      gap: 1.5rem;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 680px;
    }
    .link {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: #f1f5f9;
      width: 74px;
      font-weight: 700;
      font-size: 0.9rem;
      transition: transform 0.2s ease;
    }
    .link:hover {
      transform: translateY(-5px);
    }
    .link-icon {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 8px;
      overflow: hidden;
    }
    .link-icon img {
      width: 26px;
      height: 26px;
      object-fit: contain;
    }

    .quote {
      position: absolute;
      bottom: 36px;
      max-width: 560px;
      font-size: 1.05rem;
      font-weight: 600;
      font-style: italic;
      opacity: 0.8;
      padding: 0 20px;
    }
  </style>
</head>
<body>

  <!-- Analog Clock -->
  <div class="clock-container glass" id="analogClock">
    <div class="hand hour-hand" id="hourHand"></div>
    <div class="hand minute-hand" id="minuteHand"></div>
    <div class="hand second-hand" id="secondHand"></div>
    <div class="center-dot"></div>
  </div>

  <!-- Digital Clock -->
  <div class="digital-time" id="digitalTime">००:००</div>

  <div class="weekday" id="weekday">बुधबार</div>
  <div class="nepali-date" id="nepaliDate">२४ भदौ, २०८३</div>
  <div class="greeting" id="greeting">शुभ प्रभात</div>

  <div class="search-box">
    <form action="https://noai.duckduckgo.com/" method="get">
      <input class="glass" type="text" name="q" placeholder="वेब खोज्नुहोस्..." autofocus autocomplete="off">
      <button type="submit">⌕</button>
    </form>
  </div>

  <div class="links" id="links"></div>
  <div class="quote" id="quote"></div>

  <script>
    const nepaliWeekdays = ["आइतबार","सोमबार","मङ्गलबार","बुधबार","बिहिबार","शुक्रबार","शनिबार"];
    const nepaliMonths = ["बैशाख","जेठ","असार","साउन","भदौ","असोज","कार्तिक","मंसिर","पुस","माघ","फागुन","चैत"];
    const nepaliDigits = ["०","१","२","३","४","५","६","७","८","९"];

    function toNepali(num) {
      return String(num).split("").map(d => nepaliDigits[d] || d).join("");
    }

    function adToBs(y, m, d) {
      let bsY = y + 56;
      let bsM = m + 8;
      let bsD = d + 16;
      if (bsD > 30) { bsD -= 30; bsM++; }
      if (bsM > 12) { bsM -= 12; bsY++; }
      return `${toNepali(bsD)} ${nepaliMonths[bsM-1]}, ${toNepali(bsY)}`;
    }

    const quotes = [
      "शान्ति भित्रबाट आउँछ। बाहिर खोज्नुहोस् न। — बुद्ध",
      "तपाईंले जुन कुरा समात्नुहुन्छ, त्यही मात्र हराउनुहुन्छ। — बुद्ध",
      "मन नै सबै हो। तपाईंले जे सोच्नुहुन्छ, त्यही बन्नुहुन्छ। — बुद्ध",
      "विगतमा नबस्नुहोस्, वर्तमानमा मन केन्द्रित गर्नुहोस्। — बुद्ध",
      "प्रकृति हतार गर्दैन, तर सबै कुरा पूरा हुन्छ। — लाओ त्जु"
    ];

    const links = [
      { name: "जिमेल", url: "https://mail.google.com" },
      { name: "यूट्युब", url: "https://youtube.com" },
      { name: "गिटहब", url: "https://github.com" },
      { name: "रेडिट", url: "https://reddit.com" },
      { name: "एक्स", url: "https://x.com" },
      { name: "विकि", url: "https://wikipedia.org" }
    ];

    let isAnalog = true;
    let qIndex = 0;

    const $ = id => document.getElementById(id);

    function updateClock() {
      const now = new Date();
      const h = now.getHours();
      const m = now.getMinutes();
      const s = now.getSeconds();

      // Analog hands
      const hourDeg = (h % 12) * 30 + m * 0.5;
      const minuteDeg = m * 6;
      const secondDeg = s * 6;

      $("hourHand").style.transform = `rotate(${hourDeg}deg)`;
      $("minuteHand").style.transform = `rotate(${minuteDeg}deg)`;
      $("secondHand").style.transform = `rotate(${secondDeg}deg)`;

      // Digital
      $("digitalTime").textContent = toNepali(String(h).padStart(2,"0")) + ":" + toNepali(String(m).padStart(2,"0"));
    }

    function updateDate() {
      const now = new Date();
      $("weekday").textContent = nepaliWeekdays[now.getDay()];
      $("nepaliDate").textContent = adToBs(now.getFullYear(), now.getMonth()+1, now.getDate());
    }

    function updateGreeting() {
      const h = new Date().getHours();
      let g = "शुभ सन्ध्या";
      if (h < 12) g = "शुभ प्रभात";
      else if (h < 17) g = "शुभ दिउँसो";
      $("greeting").textContent = g;
    }

    function showQuote() {
      $("quote").textContent = quotes[qIndex];
      qIndex = (qIndex + 1) % quotes.length;
    }

    function renderLinks() {
      const container = $("links");
      container.innerHTML = "";
      links.forEach(l => {
        const a = document.createElement("a");
        a.href = l.url;
        a.className = "link";

        const icon = document.createElement("div");
        icon.className = "link-icon glass";

        try {
          const domain = new URL(l.url).hostname.replace("www.", "");
          const img = document.createElement("img");
          img.src = `https://www.google.com/s2/favicons?domain=${domain}&sz=64`;
          img.onerror = () => icon.textContent = "🔗";
          icon.appendChild(img);
        } catch {
          icon.textContent = "🔗";
        }

        a.appendChild(icon);

        const span = document.createElement("span");
        span.textContent = l.name;
        a.appendChild(span);

        container.appendChild(a);
      });
    }

    // Toggle Analog ↔ Digital
    $("analogClock").onclick = () => {
      isAnalog = false;
      $("analogClock").style.display = "none";
      $("digitalTime").style.display = "block";
    };
    $("digitalTime").onclick = () => {
      isAnalog = true;
      $("digitalTime").style.display = "none";
      $("analogClock").style.display = "block";
    };

    // Init
    updateClock();
    updateDate();
    updateGreeting();
    renderLinks();
    showQuote();

    setInterval(updateClock, 1000);
    setInterval(updateDate, 60000);
    setInterval(showQuote, 280000);
  </script>
</body>
</html>
