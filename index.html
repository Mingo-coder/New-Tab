<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Tab</title>
  <!-- Cyan outline home icon favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2300e5ff' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z'/><polyline points='9 22 9 12 15 12 15 22'/></svg>">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: white;
      text-align: center;
      overflow: hidden;
      position: relative;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      transition: color 0.3s ease;
    }
    #bg {
      position: absolute; inset: 0;
      background-size: cover; background-position: center;
      z-index: -2; opacity: 0; transition: opacity 0.5s;
    }
    #overlay {
      position: absolute; inset: 0;
      background: rgba(0,0,0,0.4);
      z-index: -1; transition: background 0.4s;
    }
    .greeting { font-size: 1.3rem; opacity: 0.9; margin-bottom: 0.5rem; }
    .time { font-size: 6.5rem; font-weight: 300; letter-spacing: -2px; margin-bottom: 0.2rem; }
    .date { font-size: 1.3rem; opacity: 0.9; margin-bottom: 1.5rem; }
    .weather { font-size: 1.1rem; opacity: 0.85; margin-bottom: 2rem; min-height: 1.4em; }
    .search-box { width: 90%; max-width: 520px; position: relative; margin-bottom: 2.5rem; }
    .search-box input {
      width: 100%; padding: 14px 48px 14px 20px;
      font-size: 1.1rem; border: none; border-radius: 50px;
      background: rgba(255,255,255,0.14); color: inherit;
      outline: none; backdrop-filter: blur(12px);
    }
    .search-box button {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      background: none; border: none; color: inherit; font-size: 1.2rem; cursor: pointer;
    }
    .links { display: flex; gap: 1.4rem; flex-wrap: wrap; justify-content: center; max-width: 700px; }
    .link {
      display: flex; flex-direction: column; align-items: center;
      text-decoration: none; color: inherit; width: 72px; opacity: 0.9;
      transition: 0.2s;
    }
    .link:hover { opacity: 1; transform: translateY(-4px); }
    .link-icon {
      width: 50px; height: 50px; border-radius: 14px;
      background: rgba(255,255,255,0.15); display: flex;
      align-items: center; justify-content: center; font-size: 1.4rem; margin-bottom: 6px;
    }
    .quote {
      position: absolute; bottom: 32px; max-width: 580px;
      font-size: 1rem; font-style: italic; opacity: 0.85; padding: 0 16px;
    }

    #settings-btn {
      position: fixed; top: 18px; left: 18px; width: 42px; height: 42px;
      border-radius: 11px; background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.15); color: inherit;
      font-size: 1.3rem; cursor: pointer; z-index: 100;
      display: flex; align-items: center; justify-content: center;
    }
    #sidebar {
      position: fixed; top: 0; left: -340px; width: 320px; height: 100%;
      background: rgba(15,23,42,0.96); backdrop-filter: blur(16px);
      z-index: 200; padding: 20px 16px 40px; overflow-y: auto;
      color: #e2e8f0; transition: left 0.3s ease;
    }
    #sidebar.open { left: 0; }
    #sidebar-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.5);
      z-index: 150; opacity: 0; visibility: hidden; transition: 0.3s;
    }
    #sidebar-overlay.show { opacity: 1; visibility: visible; }
    .sidebar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .sidebar-header h2 { font-size: 1.2rem; }
    #close-btn { background: none; border: none; color: #94a3b8; font-size: 1.5rem; cursor: pointer; }
    .group { margin-bottom: 18px; }
    .group label { display: block; font-size: 0.75rem; color: #94a3b8; margin-bottom: 5px; text-transform: uppercase; }
    .group select, .group input[type=text], .group input[type=color] {
      width: 100%; padding: 8px 10px; border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.06);
      color: white; font-size: 0.9rem;
    }
    .group input[type=range] { width: 100%; }
    .check { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
    .check label { text-transform: none; color: #e2e8f0; font-size: 0.9rem; margin: 0; }
    .link-edit { display: flex; gap: 5px; margin-bottom: 6px; }
    .link-edit input { flex: 1; }
    .link-edit button { width: 30px; background: rgba(239,68,68,0.25); border: none; color: #fca5a5; border-radius: 6px; cursor: pointer; }
    #add-link { width: 100%; padding: 8px; margin-top: 6px; background: rgba(59,130,246,0.2); border: 1px dashed #60a5fa; color: #93c5fd; border-radius: 8px; cursor: pointer; }
    .btns { display: flex; gap: 8px; margin-top: 24px; }
    .btns button { flex: 1; padding: 10px; border: none; border-radius: 8px; cursor: pointer; font-weight: 500; }
    .save { background: #3b82f6; color: white; }
    .reset { background: rgba(255,255,255,0.1); color: #e2e8f0; }

    body.dark-text { color: #0f172a; }
    body.dark-text .search-box input { background: rgba(0,0,0,0.12); color: #0f172a; }
    body.dark-text .link-icon { background: rgba(0,0,0,0.1); }
  </style>
</head>
<body>
  <div id="bg"></div>
  <div id="overlay"></div>

  <button id="settings-btn">⚙️</button>
  <div id="sidebar-overlay"></div>

  <div id="sidebar">
    <div class="sidebar-header">
      <h2>Settings</h2>
      <button id="close-btn">×</button>
    </div>

    <div class="group">
      <label>Background</label>
      <select id="bgType">
        <option value="gradient">Gradient</option>
        <option value="image">Image URL</option>
        <option value="solid">Solid Color</option>
      </select>
    </div>
    <div class="group" id="imgGroup" style="display:none">
      <label>Image URL</label>
      <input type="text" id="imgUrl" placeholder="https://...">
    </div>
    <div class="group" id="colorGroup" style="display:none">
      <label>Color</label>
      <input type="color" id="solidColor" value="#0f172a">
    </div>
    <div class="group">
      <label>Overlay Darkness</label>
      <input type="range" id="overlayVal" min="0" max="80" value="40">
    </div>
    <div class="group">
      <div class="check"><input type="checkbox" id="autoDim" checked><label for="autoDim">Auto-dim at night</label></div>
    </div>

    <div class="group">
      <label>Clock Format</label>
      <select id="clockFormat">
        <option value="24">24-hour</option>
        <option value="12">12-hour</option>
      </select>
    </div>
    <div class="group">
      <div class="check"><input type="checkbox" id="showSec"><label for="showSec">Show seconds</label></div>
    </div>
    <div class="group">
      <label>Clock Size</label>
      <input type="range" id="clockSize" min="40" max="100" value="65">
    </div>
    <div class="group">
      <label>Text Mode</label>
      <select id="textMode">
        <option value="light">Light text</option>
        <option value="dark">Dark text</option>
      </select>
    </div>

    <div class="group">
      <label>Your Name</label>
      <input type="text" id="userName" placeholder="Optional">
    </div>
    <div class="group">
      <label>Weather City</label>
      <input type="text" id="city" placeholder="Kathmandu">
    </div>
    <div class="group">
      <div class="check"><input type="checkbox" id="showWeather"><label for="showWeather">Show Weather</label></div>
    </div>

    <div class="group">
      <label>Search Engine</label>
      <select id="engine">
        <option value="google">Google</option>
        <option value="duckduckgo">DuckDuckGo</option>
        <option value="bing">Bing</option>
      </select>
    </div>

    <div class="group">
      <div class="check"><input type="checkbox" id="showQuote" checked><label for="showQuote">Show Quote</label></div>
    </div>
    <div class="group">
      <div class="check"><input type="checkbox" id="showLinks" checked><label for="showLinks">Show Links</label></div>
    </div>

    <div class="group">
      <label>Quick Links</label>
      <div id="linksEdit"></div>
      <button id="add-link">+ Add Link</button>
    </div>

    <div class="btns">
      <button class="reset" id="resetBtn">Reset</button>
      <button class="save" id="saveBtn">Done</button>
    </div>
  </div>

  <div class="greeting" id="greeting">Good morning</div>
  <div class="time" id="time">00:00</div>
  <div class="date" id="date"></div>
  <div class="weather" id="weather"></div>

  <div class="search-box">
    <form id="searchForm" action="https://www.google.com/search" method="get" target="_blank">
      <input type="text" name="q" placeholder="Search the web..." autofocus>
      <button type="submit">🔍</button>
    </form>
  </div>

  <div class="links" id="links"></div>
  <div class="quote" id="quote"></div>

  <script>
    const quotes = [
      {t:"The only way to do great work is to love what you do.", a:"Steve Jobs"},
      {t:"Stay hungry, stay foolish.", a:"Steve Jobs"},
      {t:"The future belongs to those who believe in the beauty of their dreams.", a:"Eleanor Roosevelt"},
      {t:"It does not matter how slowly you go as long as you do not stop.", a:"Confucius"},
      {t:"Success is not final, failure is not fatal.", a:"Winston Churchill"},
      {t:"Believe you can and you're halfway there.", a:"Theodore Roosevelt"},
      {t:"Do what you can, with what you have, where you are.", a:"Theodore Roosevelt"}
    ];

    const defaults = {
      bgType: "gradient",
      imgUrl: "https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=1920",
      solidColor: "#0f172a",
      overlay: 40,
      autoDim: true,
      clockFormat: "24",
      showSec: false,
      clockSize: 65,
      textMode: "light",
      userName: "",
      city: "Kathmandu",
      showWeather: false,
      engine: "google",
      showQuote: true,
      showLinks: true,
      links: [
        {name:"Gmail", url:"https://mail.google.com", icon:"📧"},
        {name:"YouTube", url:"https://youtube.com", icon:"▶️"},
        {name:"GitHub", url:"https://github.com", icon:"🐙"},
        {name:"Reddit", url:"https://reddit.com", icon:"🤖"},
        {name:"X", url:"https://twitter.com", icon:"𝕏"},
        {name:"Wiki", url:"https://wikipedia.org", icon:"📖"}
      ]
    };

    let s = JSON.parse(localStorage.getItem("ntp-safe")) || JSON.parse(JSON.stringify(defaults));
    let qIndex = 0;

    const $ = id => document.getElementById(id);

    function apply() {
      if (s.bgType === "image") {
        $("bg").style.backgroundImage = `url('${s.imgUrl}')`;
        $("bg").style.opacity = "1";
        document.body.style.background = "transparent";
      } else if (s.bgType === "solid") {
        $("bg").style.opacity = "0";
        document.body.style.background = s.solidColor;
      } else {
        $("bg").style.opacity = "0";
        document.body.style.background = "linear-gradient(135deg, #0f0c29, #302b63, #24243e)";
      }

      let op = s.overlay;
      if (s.autoDim) {
        const h = new Date().getHours();
        if (h >= 19 || h < 6) op = Math.min(80, op + 25);
      }
      $("overlay").style.background = `rgba(0,0,0,${op/100})`;

      document.body.className = s.textMode === "dark" ? "dark-text" : "";
      $("time").style.fontSize = (s.clockSize / 10) + "rem";

      $("quote").style.display = s.showQuote ? "block" : "none";
      $("links").style.display = s.showLinks ? "flex" : "none";
      $("weather").style.display = s.showWeather ? "block" : "none";

      const engines = {google:"https://www.google.com/search", duckduckgo:"https://duckduckgo.com/", bing:"https://www.bing.com/search"};
      $("searchForm").action = engines[s.engine];

      $("bgType").value = s.bgType;
      $("imgUrl").value = s.imgUrl;
      $("solidColor").value = s.solidColor;
      $("overlayVal").value = s.overlay;
      $("autoDim").checked = s.autoDim;
      $("clockFormat").value = s.clockFormat;
      $("showSec").checked = s.showSec;
      $("clockSize").value = s.clockSize;
      $("textMode").value = s.textMode;
      $("userName").value = s.userName;
      $("city").value = s.city;
      $("showWeather").checked = s.showWeather;
      $("engine").value = s.engine;
      $("showQuote").checked = s.showQuote;
      $("showLinks").checked = s.showLinks;

      toggleBg();
      renderLinks();
      renderEdit();
      updateGreeting();
      if (s.showWeather) loadWeather();
      else $("weather").textContent = "";
    }

    function toggleBg() {
      const t = $("bgType").value;
      $("imgGroup").style.display = t === "image" ? "block" : "none";
      $("colorGroup").style.display = t === "solid" ? "block" : "none";
    }

    function updateClock() {
      const now = new Date();
      let h = now.getHours();
      let m = String(now.getMinutes()).padStart(2,"0");
      let sec = String(now.getSeconds()).padStart(2,"0");

      if (s.clockFormat === "12") {
        const ap = h >= 12 ? " PM" : " AM";
        h = h % 12 || 12;
        $("time").textContent = h + ":" + m + (s.showSec ? ":" + sec : "") + ap;
      } else {
        $("time").textContent = String(h).padStart(2,"0") + ":" + m + (s.showSec ? ":" + sec : "");
      }
      $("date").textContent = now.toLocaleDateString("en-US", {weekday:"long", year:"numeric", month:"long", day:"numeric"});
    }

    function updateGreeting() {
      const h = new Date().getHours();
      let g = "Good evening";
      if (h < 12) g = "Good morning";
      else if (h < 18) g = "Good afternoon";
      $("greeting").textContent = s.userName.trim() ? g + ", " + s.userName.trim() : g;
    }

    async function loadWeather() {
      if (!s.city.trim()) {
        $("weather").textContent = "";
        return;
      }
      try {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 4000);
        const res = await fetch("https://wttr.in/" + encodeURIComponent(s.city.trim()) + "?format=%c+%t+%C", {signal: controller.signal});
        clearTimeout(timeout);
        if (res.ok) {
          $("weather").textContent = (await res.text()).trim();
        } else {
          $("weather").textContent = "";
        }
      } catch (e) {
        $("weather").textContent = "";
      }
    }

    function showQuote() {
      const q = quotes[qIndex];
      $("quote").textContent = "“" + q.t + "” — " + q.a;
      qIndex = (qIndex + 1) % quotes.length;
    }

    function renderLinks() {
      $("links").innerHTML = "";
      s.links.forEach(l => {
        const a = document.createElement("a");
        a.href = l.url;
        a.target = "_blank";
        a.className = "link";
        a.innerHTML = `<div class="link-icon">${l.icon||"🔗"}</div><span>${l.name}</span>`;
        $("links").appendChild(a);
      });
    }

    function renderEdit() {
      const box = $("linksEdit");
      box.innerHTML = "";
      s.links.forEach((l, i) => {
        const d = document.createElement("div");
        d.className = "link-edit";
        d.innerHTML = `<input value="${l.icon}" style="width:45px" placeholder="icon">
                       <input value="${l.name}" placeholder="Name">
                       <input value="${l.url}" placeholder="URL">
                       <button data-i="${i}">×</button>`;
        box.appendChild(d);
      });
      box.querySelectorAll("button").forEach(b => {
        b.onclick = () => {
          s.links.splice(b.dataset.i, 1);
          renderEdit();
        };
      });
    }

    $("add-link").onclick = () => {
      s.links.push({name:"New", url:"https://", icon:"🔗"});
      renderEdit();
    };

    $("settings-btn").onclick = () => {
      $("sidebar").classList.add("open");
      $("sidebar-overlay").classList.add("show");
      renderEdit();
    };
    $("close-btn").onclick = closeSide;
    $("sidebar-overlay").onclick = closeSide;
    function closeSide() {
      $("sidebar").classList.remove("open");
      $("sidebar-overlay").classList.remove("show");
    }

    $("bgType").onchange = toggleBg;

    $("saveBtn").onclick = () => {
      const items = document.querySelectorAll(".link-edit");
      s.links = [];
      items.forEach(item => {
        const inputs = item.querySelectorAll("input");
        s.links.push({
          icon: inputs[0].value.trim() || "🔗",
          name: inputs[1].value.trim() || "Link",
          url: inputs[2].value.trim() || "https://"
        });
      });

      s.bgType = $("bgType").value;
      s.imgUrl = $("imgUrl").value;
      s.solidColor = $("solidColor").value;
      s.overlay = +$("overlayVal").value;
      s.autoDim = $("autoDim").checked;
      s.clockFormat = $("clockFormat").value;
      s.showSec = $("showSec").checked;
      s.clockSize = +$("clockSize").value;
      s.textMode = $("textMode").value;
      s.userName = $("userName").value;
      s.city = $("city").value;
      s.showWeather = $("showWeather").checked;
      s.engine = $("engine").value;
      s.showQuote = $("showQuote").checked;
      s.showLinks = $("showLinks").checked;

      localStorage.setItem("ntp-safe", JSON.stringify(s));
      apply();
      closeSide();
    };

    $("resetBtn").onclick = () => {
      if (confirm("Reset all settings?")) {
        s = JSON.parse(JSON.stringify(defaults));
        localStorage.setItem("ntp-safe", JSON.stringify(s));
        apply();
      }
    };

    apply();
    updateClock();
    setInterval(updateClock, 1000);
    showQuote();
    setInterval(showQuote, 300000);

    document.addEventListener("keydown", e => {
      if (e.key === "Escape") closeSide();
    });
  </script>
</body>
</html>
