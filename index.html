<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>नयाँ ट्याब</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%234f46e5' stroke-width='2'><circle cx='12' cy='12' r='10'/><path d='M12 6v6l4 2'/></svg>">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@600;700;800&display=swap');

    :root {
      --bg: #f0f4ff;
      --card: #ffffff;
      --primary: #4f46e5;
      --text: #1e1b4b;
      --muted: #6366f1;
      --accent: #a5b4fc;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Noto Sans Devanagari', system-ui, sans-serif;
      font-weight: 700;
      background: linear-gradient(135deg, #e0e7ff 0%, #f0f4ff 40%, #fdf4ff 100%);
      color: var(--text);
      overflow-x: hidden;
    }

    .container {
      display: flex;
      align-items: center;
      gap: 70px;
      max-width: 1000px;
      width: 100%;
      padding: 40px 30px;
    }

    /* LEFT - Clock */
    .left {
      flex-shrink: 0;
    }

    .clock-card {
      width: 230px;
      height: 230px;
      border-radius: 50%;
      background: var(--card);
      box-shadow: 0 20px 40px rgba(79, 70, 229, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      cursor: pointer;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }
    .clock-card:hover {
      transform: scale(1.04);
      box-shadow: 0 25px 50px rgba(79, 70, 229, 0.18);
    }

    .hand {
      position: absolute;
      bottom: 50%;
      left: 50%;
      transform-origin: bottom center;
      border-radius: 8px;
      background: var(--primary);
    }
    .hour-hand { width: 6px; height: 55px; margin-left: -3px; }
    .minute-hand { width: 4px; height: 75px; margin-left: -2px; background: #6366f1; }
    .second-hand { width: 2px; height: 85px; margin-left: -1px; background: #a5b4fc; }
    .center-dot {
      width: 12px; height: 12px;
      background: var(--primary);
      border-radius: 50%;
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
    }

    .digital-time {
      display: none;
      font-size: 4.2rem;
      font-weight: 800;
      color: var(--primary);
      cursor: pointer;
      letter-spacing: -1px;
    }

    /* RIGHT */
    .right {
      flex: 1;
    }

    .weekday {
      font-size: 2rem;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 0.25rem;
    }
    .nepali-date {
      font-size: 1.2rem;
      color: var(--muted);
      margin-bottom: 1.3rem;
    }
    .greeting {
      font-size: 1.6rem;
      margin-bottom: 2rem;
      color: var(--text);
    }

    .search-box {
      position: relative;
      max-width: 420px;
      margin-bottom: 2.2rem;
    }
    .search-box input {
      width: 100%;
      padding: 16px 52px 16px 22px;
      font-size: 1.1rem;
      font-weight: 600;
      border: none;
      border-radius: 50px;
      background: var(--card);
      box-shadow: 0 10px 30px rgba(79, 70, 229, 0.1);
      color: var(--text);
      outline: none;
    }
    .search-box input::placeholder {
      color: #a5b4fc;
    }
    .search-box button {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--primary);
      font-size: 1.3rem;
      cursor: pointer;
    }

    .links {
      display: flex;
      gap: 1.2rem;
      flex-wrap: wrap;
      margin-bottom: 2rem;
    }
    .link {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: var(--text);
      width: 72px;
      font-size: 0.9rem;
      font-weight: 700;
      transition: transform 0.2s;
    }
    .link:hover { transform: translateY(-4px); }
    .link-icon {
      width: 56px;
      height: 56px;
      border-radius: 18px;
      background: var(--card);
      box-shadow: 0 8px 20px rgba(79, 70, 229, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 8px;
      overflow: hidden;
    }
    .link-icon img {
      width: 28px;
      height: 28px;
      object-fit: contain;
    }

    .quote {
      font-size: 1.05rem;
      font-style: italic;
      color: var(--muted);
      max-width: 420px;
      line-height: 1.5;
    }

    /* Small Settings */
    #settings-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      width: 42px;
      height: 42px;
      border-radius: 14px;
      background: var(--card);
      border: none;
      box-shadow: 0 6px 20px rgba(79, 70, 229, 0.12);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--primary);
      font-size: 1.2rem;
      z-index: 100;
    }

    #sidebar {
      position: fixed;
      top: 0;
      right: -320px;
      width: 300px;
      height: 100%;
      background: var(--card);
      box-shadow: -10px 0 40px rgba(0,0,0,0.08);
      padding: 24px 20px;
      z-index: 200;
      transition: right 0.3s ease;
      overflow-y: auto;
    }
    #sidebar.open { right: 0; }
    #sidebar-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.2);
      z-index: 150;
      opacity: 0;
      visibility: hidden;
      transition: 0.3s;
    }
    #sidebar-overlay.show {
      opacity: 1;
      visibility: visible;
    }

    .sidebar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }
    .sidebar-header h2 {
      font-size: 1.25rem;
      color: var(--primary);
    }
    #close-btn {
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: var(--muted);
    }

    .group {
      margin-bottom: 18px;
    }
    .group label {
      display: block;
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .group input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid #e0e7ff;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text);
      outline: none;
    }

    .save-btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 12px;
      background: var(--primary);
      color: white;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 10px;
    }

    @media (max-width: 800px) {
      .container {
        flex-direction: column;
        gap: 40px;
        text-align: center;
      }
      .right { text-align: center; }
      .links { justify-content: center; }
    }
  </style>
</head>
<body>

  <button id="settings-btn">⚙️</button>

  <div id="sidebar-overlay"></div>
  <div id="sidebar">
    <div class="sidebar-header">
      <h2>सेटिङ</h2>
      <button id="close-btn">×</button>
    </div>
    <div class="group">
      <label>तपाईंको नाम</label>
      <input type="text" id="userName" placeholder="वैकल्पिक">
    </div>
    <button class="save-btn" id="saveBtn">सम्पन्न</button>
  </div>

  <div class="container">
    <!-- LEFT -->
    <div class="left">
      <div class="clock-card" id="analogClock">
        <div class="hand hour-hand" id="hourHand"></div>
        <div class="hand minute-hand" id="minuteHand"></div>
        <div class="hand second-hand" id="secondHand"></div>
        <div class="center-dot"></div>
      </div>
      <div class="digital-time" id="digitalTime">००:००</div>
    </div>

    <!-- RIGHT -->
    <div class="right">
      <div class="weekday" id="weekday">बुधबार</div>
      <div class="nepali-date" id="nepaliDate">२४ भदौ, २०८३</div>
      <div class="greeting" id="greeting">शुभ प्रभात</div>

      <div class="search-box">
        <form action="https://noai.duckduckgo.com/" method="get">
          <input type="text" name="q" placeholder="के खोज्दै हुनुहुन्छ?" autofocus autocomplete="off">
          <button type="submit">⌕</button>
        </form>
      </div>

      <div class="links" id="links"></div>
      <div class="quote" id="quote"></div>
    </div>
  </div>

  <script>
    const nepaliWeekdays = ["आइतबार","सोमबार","मङ्गलबार","बुधबार","बिहिबार","शुक्रबार","शनिबार"];
    const nepaliMonths = ["बैशाख","जेठ","असार","साउन","भदौ","असोज","कार्तिक","मंसिर","पुस","माघ","फागुन","चैत"];
    const nepaliDigits = ["०","१","२","३","४","५","६","७","८","९"];

    function toNepali(n) {
      return String(n).split("").map(d => nepaliDigits[d] || d).join("");
    }

    function adToBs(y, m, d) {
      let bsY = y + 56, bsM = m + 8, bsD = d + 16;
      if (bsD > 30) { bsD -= 30; bsM++; }
      if (bsM > 12) { bsM -= 12; bsY++; }
      return `${toNepali(bsD)} ${nepaliMonths[bsM-1]}, ${toNepali(bsY)}`;
    }

    const quotes = [
      "शान्ति भित्रबाट आउँछ। बाहिर खोज्नुहोस् न। — बुद्ध",
      "तपाईंले जुन कुरा समात्नुहुन्छ, त्यही मात्र हराउनुहुन्छ। — बुद्ध",
      "मन नै सबै हो। तपाईंले जे सोच्नुहुन्छ, त्यही बन्नुहुन्छ। — बुद्ध",
      "विगतमा नबस्नुहोस्, वर्तमानमा मन केन्द्रित गर्नुहोस्। — बुद्ध",
      "प्रकृति हतार गर्दैन, तर सबै कुरा पूरा हुन्छ। — लाओ त्जु"
    ];

    const linksData = [
      { name: "जिमेल", url: "https://mail.google.com" },
      { name: "यूट्युब", url: "https://youtube.com" },
      { name: "गिटहब", url: "https://github.com" },
      { name: "रेडिट", url: "https://reddit.com" },
      { name: "एक्स", url: "https://x.com" },
      { name: "विकि", url: "https://wikipedia.org" }
    ];

    let s = JSON.parse(localStorage.getItem("ntp-light")) || { userName: "" };
    let qIndex = 0;
    const $ = id => document.getElementById(id);

    function updateClock() {
      const now = new Date();
      const h = now.getHours();
      const m = now.getMinutes();
      const sec = now.getSeconds();

      $("hourHand").style.transform = `rotate(${(h%12)*30 + m*0.5}deg)`;
      $("minuteHand").style.transform = `rotate(${m*6}deg)`;
      $("secondHand").style.transform = `rotate(${sec*6}deg)`;

      $("digitalTime").textContent = 
        toNepali(String(h).padStart(2,"0")) + ":" + 
        toNepali(String(m).padStart(2,"0"));
    }

    function updateDate() {
      const now = new Date();
      $("weekday").textContent = nepaliWeekdays[now.getDay()];
      $("nepaliDate").textContent = adToBs(now.getFullYear(), now.getMonth()+1, now.getDate());
    }

    function updateGreeting() {
      const h = new Date().getHours();
      let g = "शुभ सन्ध्या";
      if (h < 12) g = "शुभ प्रभात";
      else if (h < 17) g = "शुभ दिउँसो";
      $("greeting").textContent = s.userName.trim() ? g + ", " + s.userName.trim() : g;
    }

    function showQuote() {
      $("quote").textContent = quotes[qIndex];
      qIndex = (qIndex + 1) % quotes.length;
    }

    function renderLinks() {
      const box = $("links");
      box.innerHTML = "";
      linksData.forEach(l => {
        const a = document.createElement("a");
        a.href = l.url;
        a.className = "link";

        const icon = document.createElement("div");
        icon.className = "link-icon";
        try {
          const domain = new URL(l.url).hostname.replace("www.","");
          const img = document.createElement("img");
          img.src = `https://www.google.com/s2/favicons?domain=${domain}&sz=64`;
          img.onerror = () => icon.textContent = "✦";
          icon.appendChild(img);
        } catch {
          icon.textContent = "✦";
        }
        a.appendChild(icon);

        const span = document.createElement("span");
        span.textContent = l.name;
        a.appendChild(span);
        box.appendChild(a);
      });
    }

    // Toggle clock
    $("analogClock").onclick = () => {
      $("analogClock").style.display = "none";
      $("digitalTime").style.display = "block";
    };
    $("digitalTime").onclick = () => {
      $("digitalTime").style.display = "none";
      $("analogClock").style.display = "block";
    };

    // Settings
    $("settings-btn").onclick = () => {
      $("sidebar").classList.add("open");
      $("sidebar-overlay").classList.add("show");
      $("userName").value = s.userName || "";
    };
    $("close-btn").onclick = closeSide;
    $("sidebar-overlay").onclick = closeSide;
    function closeSide() {
      $("sidebar").classList.remove("open");
      $("sidebar-overlay").classList.remove("show");
    }

    $("saveBtn").onclick = () => {
      s.userName = $("userName").value.trim();
      localStorage.setItem("ntp-light", JSON.stringify(s));
      updateGreeting();
      closeSide();
    };

    updateClock();
    updateDate();
    updateGreeting();
    renderLinks();
    showQuote();

    setInterval(updateClock, 1000);
    setInterval(updateDate, 60000);
    setInterval(showQuote, 300000);
  </script>
</body>
</html>
