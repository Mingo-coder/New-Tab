<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Tab</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2300e5ff' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z'/><polyline points='9 22 9 12 15 12 15 22'/></svg>">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      color: white;
      text-align: center;
      overflow: hidden;
      position: relative;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    }
    #bg {
      position: absolute; inset: 0;
      background-size: cover; background-position: center;
      z-index: -2; opacity: 0; transition: opacity 0.6s ease;
    }
    #overlay {
      position: absolute; inset: 0;
      background: rgba(0,0,0,0.4);
      z-index: -1; transition: background 0.4s;
    }
    #main { display: flex; flex-direction: column; align-items: center; }

    .time { font-size: 6.5rem; font-weight: 500; letter-spacing: -2px; margin-bottom: 0.35rem; transition: font-size 0.3s; }

    .date-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 22px;
      margin-bottom: 0.8rem;
      transition: transform 0.3s;
    }
    .weekday {
      font-size: 2.15rem;
      font-weight: 600;
      opacity: 0.95;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .dates-right {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      line-height: 1.35;
      opacity: 0.82;
      font-size: 0.95rem;
      font-weight: 600;
      text-align: left;
    }

    .greeting { font-size: 1.3rem; font-weight: 600; opacity: 0.9; margin-bottom: 1.8rem; transition: font-size 0.3s; }

    .weather { font-size: 1.1rem; font-weight: 600; opacity: 0.85; margin-bottom: 2rem; min-height: 1.4em; }

    .search-box { width: 90%; max-width: 520px; position: relative; margin-bottom: 2.5rem; }
    .search-box input {
      width: 100%; padding: 15px 50px 15px 22px;
      font-size: 1.1rem; font-weight: 600;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 50px;
      background: rgba(255,255,255,0.09);
      color: inherit; outline: none;
      box-shadow: 0 6px 24px rgba(0,0,0,0.2);
    }
    .search-box input:focus { background: rgba(255,255,255,0.14); }
    .search-box button {
      position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
      background: none; border: none; color: inherit; font-size: 1.2rem; cursor: pointer;
    }

    .links { display: flex; gap: 1.5rem; flex-wrap: wrap; justify-content: center; max-width: 720px; transition: transform 0.3s; }
    .link {
      display: flex; flex-direction: column; align-items: center;
      text-decoration: none; color: inherit; width: 74px; opacity: 0.92;
      font-weight: 600;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }
    .link:hover { opacity: 1; transform: translateY(-4px); }

    .link-icon {
      width: 56px; height: 56px; border-radius: 50%;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.18);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.45rem; margin-bottom: 8px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.18);
      overflow: hidden;
    }
    .link-icon img {
      width: 28px;
      height: 28px;
      object-fit: contain;
    }

    .quote {
      position: absolute; bottom: 70px; max-width: 600px;
      font-size: 1rem; font-weight: 600; font-style: italic; opacity: 0.85; padding: 0 16px;
      transition: font-size 0.3s;
    }

    .nav-btns {
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 14px;
      z-index: 50;
    }
    .nav-btns button {
      width: 38px; height: 38px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.1);
      color: white;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: 0.2s;
    }
    .nav-btns button:hover { background: rgba(255,255,255,0.22); }

    #settings-btn {
      position: fixed; top: 18px; left: 18px; width: 44px; height: 44px;
      border-radius: 14px;
      background: rgba(255,255,255,0.09);
      border: 1px solid rgba(255,255,255,0.15);
      color: inherit; cursor: pointer; z-index: 100;
      display: flex; align-items: center; justify-content: center;
    }
    #settings-btn:hover { background: rgba(255,255,255,0.16); }
    #settings-btn svg { width: 22px; height: 22px; }

    #sidebar {
      position: fixed; top: 0; left: -360px; width: 340px; height: 100%;
      background: rgba(15,23,42,0.93);
      border-right: 1px solid rgba(255,255,255,0.1);
      z-index: 200; padding: 20px 16px 50px; overflow-y: auto;
      color: #e2e8f0; transition: left 0.3s ease;
      font-weight: 600;
    }
    #sidebar.open { left: 0; }
    #sidebar-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.5);
      z-index: 150; opacity: 0; visibility: hidden; transition: 0.3s;
    }
    #sidebar-overlay.show { opacity: 1; visibility: visible; }

    .sidebar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
    .sidebar-header h2 { font-size: 1.2rem; font-weight: 600; }
    #close-btn { background: none; border: none; color: #94a3b8; font-size: 1.5rem; cursor: pointer; }

    .group { margin-bottom: 15px; }
    .group label { display: block; font-size: 0.72rem; color: #94a3b8; margin-bottom: 5px; text-transform: uppercase; font-weight: 600; }
    .group select, .group input[type=text], .group input[type=color], .group textarea {
      width: 100%; padding: 8px 10px; border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.06);
      color: white; font-size: 0.9rem; font-weight: 600;
    }
    .group textarea { min-height: 80px; resize: vertical; font-size: 0.82rem; }
    .group input[type=range] { width: 100%; }
    .check { display: flex; align-items: center; gap: 8px; margin-top: 5px; }
    .check label { text-transform: none; color: #e2e8f0; font-size: 0.9rem; margin: 0; font-weight: 600; }

    .link-edit { display: flex; gap: 5px; margin-bottom: 6px; }
    .link-edit input { flex: 1; font-weight: 600; }
    .link-edit button { width: 28px; background: rgba(239,68,68,0.25); border: none; color: #fca5a5; border-radius: 6px; cursor: pointer; }
    #add-link { width: 100%; padding: 8px; margin-top: 6px; background: rgba(59,130,246,0.18); border: 1px dashed #60a5fa; color: #93c5fd; border-radius: 8px; cursor: pointer; font-weight: 600; }

    .btns { display: flex; gap: 8px; margin-top: 20px; }
    .btns button { flex: 1; padding: 10px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; }
    .save { background: #3b82f6; color: white; }
    .reset { background: rgba(255,255,255,0.1); color: #e2e8f0; }

    body.dark-text { color: #0f172a; }
    body.dark-text .search-box input { background: rgba(0,0,0,0.08); color: #0f172a; }
    body.dark-text .link-icon { background: rgba(0,0,0,0.08); }
  </style>
</head>
<body>
  <div id="bg"></div>
  <div id="overlay"></div>

  <button id="settings-btn" title="Settings">

    </svg>
  </button>

  <div id="sidebar-overlay"></div>

  <div id="sidebar">
    <div class="sidebar-header">
      <h2 id="settingsTitle">Settings</h2>
      <button id="close-btn">×</button>
    </div>

    <div class="group">
      <label id="labelLang">Language</label>
      <select id="lang">
        <option value="en">English</option>
        <option value="ne">नेपाली</option>
      </select>
    </div>

    <div class="group">
      <label id="labelBg">Background</label>
      <select id="bgType">
        <option value="gradient">Gradient</option>
        <option value="image">Single Image URL</option>
        <option value="solid">Solid Color</option>
        <option value="unsplash">Unsplash Auto / Collection</option>
      </select>
    </div>

    <div class="group" id="imgGroup" style="display:none">
      <label>Image URL</label>
      <input type="text" id="imgUrl" placeholder="https://images.unsplash.com/...">
    </div>

    <div class="group" id="colorGroup" style="display:none">
      <label>Color</label>
      <input type="color" id="solidColor" value="#0f172a">
    </div>

    <div class="group" id="unsplashGroup" style="display:none">
      <label>Unsplash Collection ID</label>
      <input type="text" id="collectionId" placeholder="e.g. 1053828">
      <textarea id="unsplashList" placeholder="https://images.unsplash.com/photo-xxxx?w=1920&q=90"></textarea>
      <label style="margin-top:10px" id="labelInterval">Change Interval</label>
      <select id="unsplashInterval">
        <option value="1">Every 1 hour</option>
        <option value="3">Every 3 hours</option>
        <option value="6">Every 6 hours</option>
        <option value="12">Every 12 hours</option>
        <option value="24" selected>Every 24 hours</option>
      </select>
    </div>

    <div class="group">
      <label id="labelOverlay">Overlay Darkness</label>
      <input type="range" id="overlayVal" min="0" max="80" value="40">
    </div>
    <div class="group">
      <div class="check"><input type="checkbox" id="autoDim" checked><label for="autoDim" id="labelAutoDim">Auto-dim at night</label></div>
    </div>

    <div class="group">
      <label id="labelClock">Clock Format</label>
      <select id="clockFormat">
        <option value="24">24-hour</option>
        <option value="12">12-hour</option>
      </select>
    </div>
    <div class="group">
      <div class="check"><input type="checkbox" id="showSec"><label for="showSec" id="labelSeconds">Show seconds</label></div>
    </div>

    <div class="group">
      <label id="labelScaleTime">Time Scale</label>
      <input type="range" id="scaleTime" min="50" max="130" value="100">
    </div>
    <div class="group">
      <label id="labelScaleGreeting">Greeting Scale</label>
      <input type="range" id="scaleGreeting" min="70" max="200" value="100">
    </div>
    <div class="group">
      <label id="labelScaleDate">Date Row Scale</label>
      <input type="range" id="scaleDate" min="70" max="160" value="100">
    </div>
    <div class="group">
      <label id="labelScaleQuote">Quote Scale</label>
      <input type="range" id="scaleQuote" min="70" max="160" value="100">
    </div>
    <div class="group">
      <label id="labelScaleLinks">Quick Links Scale</label>
      <input type="range" id="scaleLinks" min="70" max="150" value="100">
    </div>

    <div class="group">
      <label id="labelTextMode">Text Mode</label>
      <select id="textMode">
        <option value="light">Light text</option>
        <option value="dark">Dark text</option>
      </select>
    </div>

    <div class="group">
      <label id="labelName">Your Name</label>
      <input type="text" id="userName">
    </div>

    <div class="group">
      <div class="check"><input type="checkbox" id="showNepaliDate" checked><label for="showNepaliDate" id="labelNepaliDate">Show Nepali Date</label></div>
    </div>

    <div class="group">
      <label id="labelCity">Weather City</label>
      <input type="text" id="city" placeholder="Kathmandu">
    </div>
    <div class="group">
      <div class="check"><input type="checkbox" id="showWeather"><label for="showWeather" id="labelWeather">Show Weather</label></div>
    </div>

    <div class="group">
      <label id="labelEngine">Search Engine</label>
      <select id="engine">
        <option value="google">Google</option>
        <option value="duckduckgo">DuckDuckGo</option>
        <option value="bing">Bing</option>
      </select>
    </div>
    <div class="group">
      <div class="check"><input type="checkbox" id="showSearch" checked><label for="showSearch" id="labelSearch">Show Search Bar</label></div>
    </div>
    <div class="group">
      <div class="check"><input type="checkbox" id="showQuote" checked><label for="showQuote" id="labelQuote">Show Quote</label></div>
    </div>
    <div class="group">
      <div class="check"><input type="checkbox" id="showLinks" checked><label for="showLinks" id="labelLinks">Show Links</label></div>
    </div>

    <div class="group">
      <label id="labelQuickLinks">Quick Links</label>
      <div id="linksEdit"></div>
      <button id="add-link">+ Add Link</button>
    </div>

    <div class="btns">
      <button class="reset" id="resetBtn">Reset</button>
      <button class="save" id="saveBtn">Done</button>
    </div>
  </div>

  <div id="main">
    <div class="time" id="time">00:00</div>

    <div class="date-row" id="dateRow">
      <div class="weekday" id="weekday">WEDNESDAY</div>
      <div class="dates-right">
        <div id="engDate">9 September, 2026</div>
        <div id="nepDate">२४ भदौ, २०८३</div>
      </div>
    </div>

    <div class="greeting" id="greeting">Good morning</div>

    <div class="weather" id="weather"></div>

    <div class="search-box" id="searchBox">
      <form id="searchForm" action="https://www.google.com/search" method="get" target="_blank">
        <input type="text" name="q" id="searchInput" placeholder="Search the web..." autofocus>
        <button type="submit">🔍</button>
      </form>
    </div>

    <div class="links" id="links"></div>
  </div>

  <div class="quote" id="quote"></div>

  <div class="nav-btns">
    <button id="prevBtn" title="Previous image">‹</button>
    <button id="nextBtn" title="Next image">›</button>

      let bsYear = adYear + 56;
      let bsMonth = adMonth + 8;
      let bsDay = adDay + 16;
      if (bsDay > 30) { bsDay -= 30; bsMonth++; }

    let s = JSON.parse(localStorage.getItem("ntp-safe")) || JSON.parse(JSON.stringify(defaults));
    let qIndex = 0;

    const $ = id => document.getElementById(id);

    function getDomain(url) {
      try {
        return new URL(url).hostname.replace("www.", "");
      } catch {

    }

    function getUnsplashImages() {
      const list = (s.unsplashList || "").split("\n").map(u => u.trim()).filter(u => u.startsWith("http"));
      return list.length > 0 ? list : defaultUnsplash;
    }

    async function fetchFromCollection() {
      if (!s.collectionId || !s.accessKey) return null;
      try {
        const url = `https://api.unsplash.com/photos/random?collections=${s.collectionId}&count=12&orientation=landscape`;
        const res = await fetch(url, {
          headers: { Authorization: `Client-ID ${s.accessKey}` }
        });
        if (!res.ok) return null;
        const data = await res.json();
        return data.map(img => img.urls.raw + "&w=1920&q=90");
      } catch (e) {
        return null;
      }
    }

    async function prepareImages() {
      if (s.bgType === "unsplash" && s.collectionId && s.accessKey) {
        const apiImages = await fetchFromCollection();
        if (apiImages && apiImages.length) {
          currentImages = apiImages;
          return;
        }
      }
      currentImages = getUnsplashImages();
    }

    function setBackground(url) {
      s.imgUrl = url;
      $("bg").style.backgroundImage = `url('${url}')`;
      $("bg").style.opacity = "1";
      document.body.style.background = "transparent";
      localStorage.setItem("ntp-safe", JSON.stringify(s));
    }

    function showImageByIndex(index) {
      if (!currentImages.length) return;
      s.imageIndex = (index + currentImages.length) % currentImages.length;
      setBackground(currentImages[s.imageIndex]);
    }

    function applyLanguage() {
      const t = translations[s.lang] || translations.en;
      $("settingsTitle").textContent = t.settingsTitle;
      $("labelLang").textContent = t.labelLang;
      $("labelBg").textContent = t.labelBg;
      $("labelInterval").textContent = t.labelInterval;
      $("labelOverlay").textContent = t.labelOverlay;
      $("labelAutoDim").textContent = t.labelAutoDim;
      $("labelClock").textContent = t.labelClock;
      $("labelSeconds").textContent = t.labelSeconds;
      $("labelScaleTime").textContent = t.labelScaleTime;
      $("labelScaleGreeting").textContent = t.labelScaleGreeting;
      $("labelScaleDate").textContent = t.labelScaleDate;
      $("labelScaleQuote").textContent = t.labelScaleQuote;
      $("labelScaleLinks").textContent = t.labelScaleLinks;
      $("labelTextMode").textContent = t.labelTextMode;
      $("labelName").textContent = t.labelName;
      $("labelNepaliDate").textContent = t.labelNepaliDate;
      $("labelCity").textContent = t.labelCity;
      $("labelWeather").textContent = t.labelWeather;
      $("labelEngine").textContent = t.labelEngine;
      $("labelSearch").textContent = t.labelSearch;
      $("labelQuote").textContent = t.labelQuote;
      $("labelLinks").textContent = t.labelLinks;
      $("labelQuickLinks").textContent = t.labelQuickLinks;
      $("saveBtn").textContent = t.save;
      $("resetBtn").textContent = t.reset;
      $("searchInput").placeholder = t.searchPlaceholder;
    }

    async function apply() {
      await prepareImages();

      if (s.bgType === "unsplash" || s.bgType === "image") {
        if (!s.imgUrl && currentImages.length) s.imgUrl = currentImages[0];
        setBackground(s.imgUrl);
      } else if (s.bgType === "solid") {
        $("bg").style.opacity = "0";
        document.body.style.background = s.solidColor;
      } else {
        $("bg").style.opacity = "0";
        document.body.style.background = "linear-gradient(135deg, #0f0c29, #302b63, #24243e)";
      }

      let op = s.overlay;
      if (s.autoDim) {
        const h = new Date().getHours();
        if (h >= 19 || h < 6) op = Math.min(80, op + 25);
      }
      $("overlay").style.background = `rgba(0,0,0,${op/100})`;

      $("greeting").style.fontSize = (1.3 * s.scaleGreeting / 100) + "rem";
      $("time").style.fontSize = (6.5 * s.scaleTime / 100) + "rem";
      $("dateRow").style.transform = `scale(${s.scaleDate / 100})`;
      $("quote").style.fontSize = (1.0 * s.scaleQuote / 100) + "rem";
      $("links").style.transform = `scale(${s.scaleLinks / 100})`;

      document.body.className = s.textMode === "dark" ? "dark-text" : "";

      $("quote").style.display = s.showQuote ? "block" : "none";
      $("links").style.display = s.showLinks ? "flex" : "none";
      $("weather").style.display = s.showWeather ? "block" : "none";
      $("searchBox").style.display = s.showSearch ? "block" : "none";
      $("nepDate").style.display = s.showNepaliDate ? "block" : "none";

      const engines = {google:"https://www.google.com/search", duckduckgo:"https://duckduckgo.com/", bing:"https://www.bing.com/search"};
      $("searchForm").action = engines[s.engine];

      $("lang").value = s.lang;
      $("bgType").value = s.bgType;
      $("imgUrl").value = s.imgUrl;
      $("solidColor").value = s.solidColor;
      $("overlayVal").value = s.overlay;
      $("autoDim").checked = s.autoDim;
      $("clockFormat").value = s.clockFormat;
      $("showSec").checked = s.showSec;
      $("textMode").value = s.textMode;
      $("userName").value = s.userName;
      $("showNepaliDate").checked = s.showNepaliDate;
      $("city").value = s.city;
      $("showWeather").checked = s.showWeather;
      $("engine").value = s.engine;
      $("showSearch").checked = s.showSearch;
      $("showQuote").checked = s.showQuote;
      $("showLinks").checked = s.showLinks;
      $("scaleGreeting").value = s.scaleGreeting;
      $("scaleTime").value = s.scaleTime;
      $("scaleDate").value = s.scaleDate;
      $("scaleQuote").value = s.scaleQuote;
      $("scaleLinks").value = s.scaleLinks;
      $("unsplashInterval").value = s.unsplashInterval;
      $("unsplashList").value = s.unsplashList || defaultUnsplash.join("\n");
      $("collectionId").value = s.collectionId || "";
      $("accessKey").value = s.accessKey || "";

      toggleBg();
      renderLinks();
      renderEdit();
      applyLanguage();
      updateGreeting();
      updateDates();

      if (s.showWeather) loadWeather();
      else $("weather").textContent = "";
    }

    function toggleBg() {
      const t = $("bgType").value;
      $("imgGroup").style.display = t === "image" ? "block" : "none";
      $("colorGroup").style.display = t === "solid" ? "block" : "none";
      $("unsplashGroup").style.display = t === "unsplash" ? "block" : "none";
    }

    function updateClock() {
      const now = new Date();
      let h = now.getHours();
      let m = String(now.getMinutes()).padStart(2,"0");
      let sec = String(now.getSeconds()).padStart(2,"0");

      if (s.clockFormat === "12") {
        const ap = h >= 12 ? " PM" : " AM";
        h = h % 12 || 12;
        $("time").textContent = h + ":" + m + (s.showSec ? ":" + sec : "") + ap;
      } else {
        $("time").textContent = String(h).padStart(2,"0") + ":" + m + (s.showSec ? ":" + sec : "");
      }
    }

    function updateDates() {
      const now = new Date();
      const weekdayEn = now.toLocaleDateString("en-US", { weekday: "long" }).toUpperCase();
      const weekdayNe = nepaliWeekdays[now.getDay()];

      $("weekday").textContent = s.lang === "ne" ? weekdayNe : weekdayEn;

      const day = now.getDate();
      const month = now.toLocaleDateString("en-US", { month: "long" });
      const year = now.getFullYear();
      $("engDate").textContent = `${day} ${month}, ${year}`;

      $("nepDate").textContent = adToBs(now.getFullYear(), now.getMonth()+1, now.getDate());
    }

    function updateGreeting() {
      const h = new Date().getHours();
      const t = translations[s.lang] || translations.en;
      let g = t.goodEvening;
      if (h < 12) g = t.goodMorning;
      else if (h < 18) g = t.goodAfternoon;
      $("greeting").textContent = s.userName.trim() ? g + ", " + s.userName.trim() : g;
    }

    async function loadWeather() {
      if (!s.city.trim()) { $("weather").textContent = ""; return; }
      try {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 2500);
        const res = await fetch("https://wttr.in/" + encodeURIComponent(s.city.trim()) + "?format=%c+%t+%C", { signal: controller.signal });
        clearTimeout(timeout);
        if (res.ok) $("weather").textContent = (await res.text()).trim() || "";
        else $("weather").textContent = "";
      } catch (e) {
        $("weather").textContent = "";
      }
    }

    function showQuote() {
      const q = quotes[qIndex];
      $("quote").textContent = "“" + q.t + "” — " + q.a;
      qIndex = (qIndex + 1) % quotes.length;
    }

    function renderLinks() {
      $("links").innerHTML = "";
      s.links.forEach(l => {
        const a = document.createElement("a");
        a.href = l.url;
        a.target = "_blank";
        a.className = "link";

        const domain = getDomain(l.url);
        const faviconUrl = domain ? `https://www.google.com/s2/favicons?domain=${domain}&sz=64` : "";

        const iconDiv = document.createElement("div");
        iconDiv.className = "link-icon";

        if (faviconUrl) {
          const img = document.createElement("img");
          img.src = faviconUrl;
          img.alt = "";
          img.onerror = () => {
            iconDiv.textContent = l.icon || "🔗";
          };
          iconDiv.appendChild(img);
        } else {
          iconDiv.textContent = l.icon || "🔗";
        }

        a.appendChild(iconDiv);

        const span = document.createElement("span");
        span.textContent = l.name;
        a.appendChild(span);

        $("links").appendChild(a);
      });
    }

    function renderEdit() {
      const box = $("linksEdit");
      box.innerHTML = "";
      s.links.forEach((l, i) => {
        const d = document.createElement("div");
        d.className = "link-edit";
        d.innerHTML = `<input value="${l.icon}" style="width:42px" placeholder="emoji">
                       <input value="${l.name}" placeholder="Name">
                       <input value="${l.url}" placeholder="URL">
                       <button data-i="${i}">×</button>`;
        box.appendChild(d);
      });
      box.querySelectorAll("button").forEach(b => {
        b.onclick = () => { s.links.splice(b.dataset.i, 1); renderEdit(); };
      });
    }

    $("add-link").onclick = () => {
      s.links.push({name:"New", url:"https://", icon:"🔗"});
      renderEdit();
    };

    $("settings-btn").onclick = () => {
      $("sidebar").classList.add("open");
      $("sidebar-overlay").classList.add("show");
      renderEdit();
    };
    $("close-btn").onclick = closeSide;
    $("sidebar-overlay").onclick = closeSide;
    function closeSide() {
      $("sidebar").classList.remove("open");
      $("sidebar-overlay").classList.remove("show");
    }

    $("bgType").onchange = toggleBg;

    $("prevBtn").onclick = () => showImageByIndex(s.imageIndex - 1);
    $("nextBtn").onclick = () => showImageByIndex(s.imageIndex + 1);

    $("scaleGreeting").oninput = () => $("greeting").style.fontSize = (1.3 * $("scaleGreeting").value / 100) + "rem";
    $("scaleTime").oninput = () => $("time").style.fontSize = (6.5 * $("scaleTime").value / 100) + "rem";
    $("scaleDate").oninput = () => $("dateRow").style.transform = `scale(${$("scaleDate").value / 100})`;
    $("scaleQuote").oninput = () => $("quote").style.fontSize = (1.0 * $("scaleQuote").value / 100) + "rem";
    $("scaleLinks").oninput = () => $("links").style.transform = `scale(${$("scaleLinks").value / 100})`;

    $("saveBtn").onclick = () => {
      const items = document.querySelectorAll(".link-edit");
      s.links = [];
      items.forEach(item => {
        const inputs = item.querySelectorAll("input");
        s.links.push({
          icon: inputs[0].value.trim() || "🔗",
          name: inputs[1].value.trim() || "Link",
          url: inputs[2].value.trim() || "https://"
        });
      });

      s.lang = $("lang").value;
      s.bgType = $("bgType").value;
      s.imgUrl = $("imgUrl").value;
      s.solidColor = $("solidColor").value;
      s.overlay = +$("overlayVal").value;
      s.autoDim = $("autoDim").checked;
      s.clockFormat = $("clockFormat").value;
      s.showSec = $("showSec").checked;
      s.textMode = $("textMode").value;
      s.userName = $("userName").value;
      s.showNepaliDate = $("showNepaliDate").checked;
      s.city = $("city").value;
      s.showWeather = $("showWeather").checked;
      s.engine = $("engine").value;
      s.showSearch = $("showSearch").checked;
      s.showQuote = $("showQuote").checked;
      s.showLinks = $("showLinks").checked;
      s.scaleGreeting = +$("scaleGreeting").value;
      s.scaleTime = +$("scaleTime").value;
      s.scaleDate = +$("scaleDate").value;
      s.scaleQuote = +$("scaleQuote").value;
      s.scaleLinks = +$("scaleLinks").value;
      s.unsplashInterval = +$("unsplashInterval").value;
      s.unsplashList = $("unsplashList").value;
      s.collectionId = $("collectionId").value.trim();
      s.accessKey = $("accessKey").value.trim();

      localStorage.setItem("ntp-safe", JSON.stringify(s));
      apply();
      closeSide();
    };

    $("resetBtn").onclick = () => {
      if (confirm(s.lang === "ne" ? "सबै सेटिङ रिसेट गर्ने?" : "Reset all settings?")) {
        s = JSON.parse(JSON.stringify(defaults));
        localStorage.setItem("ntp-safe", JSON.stringify(s));
        apply();
      }
    };

    apply();
    updateClock();
    setInterval(updateClock, 1000);
    setInterval(updateDates, 60000);
    showQuote();
    setInterval(showQuote, 300000);

    document.addEventListener("keydown", e => {
      if (e.key === "Escape") closeSide();
      if (e.key === "ArrowLeft") showImageByIndex(s.imageIndex - 1);
      if (e.key === "ArrowRight") showImageByIndex(s.imageIndex + 1);
    });
  </script>
</body>
</html>
