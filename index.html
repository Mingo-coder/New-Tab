<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New Tab</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: white;
      text-align: center;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      background-size: cover;
      background-position: center;
      overflow: hidden;
      position: relative;
    }

    /* Optional beautiful background image (Unsplash) */
    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background: url('https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=1920&q=80') center/cover no-repeat;
      opacity: 0.45;
      z-index: -1;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.35);
      z-index: -1;
    }

    .time {
      font-size: 7rem;
      font-weight: 300;
      letter-spacing: -2px;
      margin-bottom: 0.2rem;
      text-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }

    .date {
      font-size: 1.5rem;
      font-weight: 400;
      opacity: 0.9;
      margin-bottom: 2.5rem;
      text-shadow: 0 2px 10px rgba(0,0,0,0.3);
    }

    .search-box {
      width: 90%;
      max-width: 580px;
      position: relative;
      margin-bottom: 3rem;
    }

    .search-box input {
      width: 100%;
      padding: 16px 50px 16px 24px;
      font-size: 1.15rem;
      border: none;
      border-radius: 50px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px);
      color: white;
      outline: none;
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
      transition: all 0.3s ease;
    }

    .search-box input::placeholder {
      color: rgba(255, 255, 255, 0.7);
    }

    .search-box input:focus {
      background: rgba(255, 255, 255, 0.25);
      box-shadow: 0 8px 40px rgba(0,0,0,0.3);
    }

    .search-box button {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: white;
      font-size: 1.4rem;
      cursor: pointer;
      opacity: 0.8;
      padding: 8px;
    }

    .links {
      display: flex;
      gap: 1.8rem;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 700px;
    }

    .link {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: white;
      opacity: 0.9;
      transition: all 0.25s ease;
      width: 80px;
    }

    .link:hover {
      opacity: 1;
      transform: translateY(-4px);
    }

    .link-icon {
      width: 56px;
      height: 56px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      margin-bottom: 8px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
    }

    .link span {
      font-size: 0.85rem;
      font-weight: 500;
    }

    .quote {
      position: absolute;
      bottom: 40px;
      max-width: 600px;
      font-size: 1.05rem;
      font-style: italic;
      opacity: 0.85;
      padding: 0 20px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }

    @media (max-width: 600px) {
      .time {
        font-size: 4.5rem;
      }
      .date {
        font-size: 1.2rem;
      }
      .links {
        gap: 1.2rem;
      }
    }
  </style>
</head>
<body>
  <div class="overlay"></div>

  <div class="time" id="time">00:00</div>
  <div class="date" id="date">Loading...</div>

  <div class="search-box">
    <form id="searchForm" action="https://www.google.com/search" method="get" target="_blank">
      <input type="text" name="q" placeholder="Search the web..." autocomplete="off" autofocus />
      <button type="submit">🔍</button>
    </form>
  </div>

  <div class="links">
    <a href="https://mail.google.com" class="link" target="_blank">
      <div class="link-icon">📧</div>
      <span>Gmail</span>
    </a>
    <a href="https://youtube.com" class="link" target="_blank">
      <div class="link-icon">▶️</div>
      <span>YouTube</span>
    </a>
    <a href="https://github.com" class="link" target="_blank">
      <div class="link-icon">🐙</div>
      <span>GitHub</span>
    </a>
    <a href="https://reddit.com" class="link" target="_blank">
      <div class="link-icon">🤖</div>
      <span>Reddit</span>
    </a>
    <a href="https://twitter.com" class="link" target="_blank">
      <div class="link-icon">𝕏</div>
      <span>X</span>
    </a>
    <a href="https://wikipedia.org" class="link" target="_blank">
      <div class="link-icon">📖</div>
      <span>Wiki</span>
    </a>
  </div>

  <div class="quote" id="quote">
    “The only way to do great work is to love what you do.” — Steve Jobs
  </div>

  <script>
    function updateClock() {
      const now = new Date();
      
      // Time
      let hours = now.getHours();
      let minutes = now.getMinutes();
      const ampm = hours >= 12 ? 'PM' : 'AM';
      
      // 24-hour format (change to 12-hour if you prefer)
      hours = hours.toString().padStart(2, '0');
      minutes = minutes.toString().padStart(2, '0');
      
      document.getElementById('time').textContent = `${hours}:${minutes}`;

      // Date
      const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
      document.getElementById('date').textContent = now.toLocaleDateString('en-US', options);
    }

    // Update every second
    updateClock();
    setInterval(updateClock, 1000);

    // Optional: change search engine
    // To use DuckDuckGo instead of Google, change the form action to:
    // action="https://duckduckgo.com/"
  </script>
</body>
</html>
